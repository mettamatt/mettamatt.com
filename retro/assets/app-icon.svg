<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">Handheld game console icon</title>
  <rect width="1024" height="1024" fill="#FAF6EE"/>

  <g id="console" fill="#000" transform="translate(512 512) scale(0.94) translate(-512 -512)">
    <g id="body">
      <rect x="214" y="106" width="596" height="812" rx="94" ry="94" fill="#fff" stroke="#000" stroke-width="20"/>
    </g>

    <g id="screen">
      <rect x="254" y="153" width="515" height="417" rx="48" ry="48"/>

      <g id="screen-lines" fill="#fff">
        <rect x="327" y="239" width="142" height="21" rx="10.5"/>
        <rect x="327" y="299" width="375" height="21" rx="10.5"/>
        <rect x="327" y="358" width="227" height="21" rx="10.5"/>
        <rect x="570" y="358" width="115" height="21" rx="10.5"/>
        <rect x="327" y="416" width="51" height="21" rx="10.5"/>
        <rect x="392" y="416" width="250" height="21" rx="10.5"/>
        <rect x="327" y="472" width="82" height="21" rx="10.5"/>
        <rect x="422" y="472" width="57" height="21" rx="10.5"/>
        <rect x="496" y="472" width="38" height="21" rx="10.5"/>
        <rect x="550" y="472" width="107" height="21" rx="10.5"/>
      </g>
    </g>

    <g id="controls">
      <g id="d-pad">
        <rect x="320" y="618" width="62" height="177" rx="10" ry="10"/>
        <rect x="265" y="675" width="173" height="62" rx="10" ry="10"/>
      </g>

      <g id="action-buttons">
        <circle cx="715" cy="656" r="39"/>
        <circle cx="645" cy="733" r="39"/>
      </g>
    </g>

    <g id="speaker" fill="none" stroke="#000" stroke-width="17" stroke-linecap="round">
      <line x1="654" y1="836" x2="718" y2="772"/>
      <line x1="675" y1="859" x2="739" y2="795"/>
      <line x1="696" y1="882" x2="760" y2="818"/>
    </g>
  </g>
</svg>

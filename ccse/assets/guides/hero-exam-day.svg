<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-labelledby="title desc">
  <title id="title">CCSE exam day sequence</title>
  <desc id="desc">A five-step CCSE exam day sequence: arrive thirty minutes early per official timing, present identity documents, pass the photo ID check, sit the paper test, and receive results in about twenty days. A side panel shows that a fully filled circle is the only valid answer mark, while an X, a tick, or a partially filled circle are invalid.</desc>
  <rect width="880" height="360" rx="6" fill="#fbf7ec"/>
  <rect x="18" y="18" width="844" height="324" rx="4" fill="none" stroke="#e7dec9" stroke-width="2"/>

  <!-- Heading -->
  <g transform="translate(54 60)">
    <path d="M0 6h88" stroke="#ad1519" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 22h88" stroke="#c9a227" stroke-width="5" stroke-linecap="round"/>
    <text x="0" y="68" font-family="Iowan Old Style, Georgia, serif" font-size="34" font-weight="700" fill="#1c1d1f">CCSE exam day</text>
    <text x="0" y="102" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#4a4a4a">Five steps from arrival to results.</text>
    <text x="0" y="128" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#4a4a4a">Official guide: 30 minutes early.</text>
  </g>

  <!-- Step sequence -->
  <g transform="translate(54 212)" font-family="Helvetica, Arial, sans-serif">

    <!-- 1. Arrive -->
    <rect width="132" height="78" rx="5" fill="#fefcf6" stroke="#e7dec9"/>
    <circle cx="117" cy="15" r="9" fill="#ad1519"/>
    <text x="117" y="19" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <circle cx="28" cy="28" r="15" fill="#fff4f2" stroke="#ad1519" stroke-width="3"/>
    <path d="M28 18v11l8 5" fill="none" stroke="#1c1d1f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="33" font-size="15" font-weight="700" fill="#1c1d1f">Arrive</text>
    <text x="66" y="66" font-size="13" fill="#4a4a4a" text-anchor="middle">30 min early</text>

    <path d="M137 32l8 7-8 7" fill="none" stroke="#c9a227" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 2. Docs -->
    <rect x="150" width="132" height="78" rx="5" fill="#f1f5e6" stroke="#d6dfbe"/>
    <circle cx="267" cy="15" r="9" fill="#ad1519"/>
    <text x="267" y="19" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <rect x="172" y="17" width="26" height="34" rx="3" fill="#ffffff" stroke="#6b8e23" stroke-width="2"/>
    <circle cx="185" cy="30" r="6" fill="#6b8e23"/>
    <path d="M178 44c4-6 10-6 14 0" fill="none" stroke="#6b8e23" stroke-width="2.5" stroke-linecap="round"/>
    <text x="204" y="33" font-size="15" font-weight="700" fill="#1c1d1f">Docs</text>
    <text x="216" y="66" font-size="13" fill="#4a4a4a" text-anchor="middle">Passport + TIE</text>

    <path d="M287 32l8 7-8 7" fill="none" stroke="#c9a227" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 3. Photo -->
    <rect x="300" width="132" height="78" rx="5" fill="#fff4f2" stroke="#f1d1cd"/>
    <circle cx="417" cy="15" r="9" fill="#ad1519"/>
    <text x="417" y="19" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <rect x="320" y="19" width="36" height="28" rx="4" fill="#ffffff" stroke="#ad1519" stroke-width="2"/>
    <circle cx="338" cy="33" r="7" fill="#ad1519"/>
    <text x="362" y="33" font-size="15" font-weight="700" fill="#1c1d1f">Photo</text>
    <text x="366" y="66" font-size="13" fill="#4a4a4a" text-anchor="middle">ID check</text>

    <path d="M437 32l8 7-8 7" fill="none" stroke="#c9a227" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 4. Paper -->
    <rect x="450" width="132" height="78" rx="5" fill="#ffffff" stroke="#e7dec9"/>
    <circle cx="567" cy="15" r="9" fill="#ad1519"/>
    <text x="567" y="19" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <path d="M472 18h26l9 9v26h-35z" fill="#fefcf6" stroke="#c9a227" stroke-width="2" stroke-linejoin="round"/>
    <path d="M498 18v9h9" fill="none" stroke="#c9a227" stroke-width="2"/>
    <path d="M479 37h20M479 46h14" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round"/>
    <text x="522" y="33" font-size="15" font-weight="700" fill="#1c1d1f">Paper</text>
    <text x="516" y="66" font-size="13" fill="#4a4a4a" text-anchor="middle">No phone</text>

    <path d="M587 32l8 7-8 7" fill="none" stroke="#c9a227" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 5. Results -->
    <rect x="600" width="132" height="78" rx="5" fill="#fefcf6" stroke="#e7dec9"/>
    <circle cx="717" cy="15" r="9" fill="#ad1519"/>
    <text x="717" y="19" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <circle cx="628" cy="29" r="15" fill="#f1f5e6" stroke="#6b8e23" stroke-width="3"/>
    <path d="M621 29l5 5 9-11" fill="none" stroke="#1c1d1f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="652" y="33" font-size="15" font-weight="700" fill="#1c1d1f">Results</text>
    <text x="666" y="66" font-size="13" fill="#4a4a4a" text-anchor="middle">About 20 days</text>
  </g>

  <!-- Answer sheet panel -->
  <g transform="translate(548 50)" font-family="Helvetica, Arial, sans-serif">
    <rect width="258" height="152" rx="5" fill="#ffffff" stroke="#e7dec9"/>
    <rect x="16" y="14" width="226" height="30" rx="4" fill="#fefcf6" stroke="#e7dec9"/>
    <text x="32" y="34" font-size="15" font-weight="700" fill="#1c1d1f">Answer sheet</text>

    <!-- Valid row -->
    <g transform="translate(30 64)">
      <text x="0" y="15" font-size="11" font-weight="700" letter-spacing="0.5" fill="#6b8e23">VALID</text>
      <circle cx="80" cy="10" r="10" fill="#1c1d1f"/>
      <text x="102" y="15" font-size="13" fill="#4a4a4a">Filled circle only</text>
    </g>

    <!-- Invalid row -->
    <g transform="translate(30 102)">
      <text x="0" y="15" font-size="11" font-weight="700" letter-spacing="0.5" fill="#ad1519">INVALID</text>
      <path d="M76 1l18 18M94 1L76 19" stroke="#ad1519" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M118 11l7 8 14-19" fill="none" stroke="#ad1519" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="176" cy="10" r="10" fill="#ffffff" stroke="#ad1519" stroke-width="2.5"/>
      <path d="M176 0a10 10 0 0 1 0 20z" fill="#ad1519"/>
    </g>

    <text x="30" y="140" font-size="11.5" fill="#8a8275">Avoid X, ticks, or partial fills.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-labelledby="title desc">
  <title id="title">CCSE exam overview</title>
  <desc id="desc">A 25-question CCSE exam card showing 45 minutes, 15 correct answers to pass, and five task areas.</desc>
  <rect width="880" height="360" rx="6" fill="#fbf7ec"/>
  <rect x="18" y="18" width="844" height="324" rx="4" fill="none" stroke="#e7dec9" stroke-width="2"/>
  <path d="M54 72h88" stroke="#ad1519" stroke-width="5" stroke-linecap="round"/>
  <path d="M54 88h88" stroke="#c9a227" stroke-width="5" stroke-linecap="round"/>
  <text x="54" y="138" font-family="Iowan Old Style, Georgia, serif" font-size="34" font-weight="700" fill="#1c1d1f">CCSE at a glance</text>
  <text x="54" y="174" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4a4a4a">Spain citizenship knowledge exam</text>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <circle cx="570" cy="118" r="60" fill="#f1f5e6" stroke="#6b8e23" stroke-width="3"/>
    <text x="570" y="113" font-size="34" font-weight="700" fill="#1c1d1f">25</text>
    <text x="570" y="140" font-size="15" fill="#4a4a4a">questions</text>
    <circle cx="712" cy="118" r="60" fill="#fefcf6" stroke="#c9a227" stroke-width="3"/>
    <text x="712" y="113" font-size="34" font-weight="700" fill="#1c1d1f">45</text>
    <text x="712" y="140" font-size="15" fill="#4a4a4a">minutes</text>
    <circle cx="641" cy="244" r="60" fill="#fff4f2" stroke="#ad1519" stroke-width="3"/>
    <text x="641" y="239" font-size="34" font-weight="700" fill="#1c1d1f">15</text>
    <text x="641" y="266" font-size="15" fill="#4a4a4a">correct to pass</text>
  </g>
  <g transform="translate(54 222)" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4a4a4a">
    <rect width="380" height="18" rx="9" fill="#ad1519"/>
    <rect x="228" width="152" height="18" rx="9" fill="#c9a227"/>
    <text x="0" y="48">60% government, law, participation</text>
    <text x="0" y="76">40% culture, history, society</text>
  </g>
</svg>

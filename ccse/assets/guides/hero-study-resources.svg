<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-labelledby="title desc">
  <title id="title">Best CCSE study resources</title>
  <desc id="desc">A centered study kit showing official materials first, then bilingual explanations, vocabulary, and timed mock exams.</desc>
  <rect width="880" height="360" rx="6" fill="#fbf7ec"/>
  <rect x="18" y="18" width="844" height="324" rx="4" fill="none" stroke="#e7dec9" stroke-width="2"/>
  <text x="54" y="78" font-family="Iowan Old Style, Georgia, serif" font-size="33" font-weight="700" fill="#1c1d1f">Build from the official source</text>
  <text x="54" y="110" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#4a4a4a">Then add tools that help English speakers understand and recall.</text>

  <g transform="translate(82 152)" font-family="Helvetica, Arial, sans-serif">
    <rect width="168" height="112" rx="5" fill="#f1f5e6" stroke="#6b8e23"/>
    <text x="84" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1d1f">Official</text>
    <text x="84" y="69" text-anchor="middle" font-size="14" fill="#4a4a4a">manual, model test</text>
    <text x="84" y="92" text-anchor="middle" font-size="14" fill="#4a4a4a">and glossary</text>

    <path d="M190 56h64" stroke="#c9a227" stroke-width="5" stroke-linecap="round"/><path d="M242 41l26 15-26 15" fill="none" stroke="#c9a227" stroke-width="5" stroke-linejoin="round"/>

    <rect x="282" width="168" height="112" rx="5" fill="#fff4f2" stroke="#e7dec9"/>
    <text x="366" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1d1f">Understand</text>
    <text x="366" y="69" text-anchor="middle" font-size="14" fill="#4a4a4a">bilingual notes</text>
    <text x="366" y="92" text-anchor="middle" font-size="14" fill="#4a4a4a">and explanations</text>

    <path d="M472 56h64" stroke="#c9a227" stroke-width="5" stroke-linecap="round"/><path d="M524 41l26 15-26 15" fill="none" stroke="#c9a227" stroke-width="5" stroke-linejoin="round"/>

    <rect x="564" width="168" height="112" rx="5" fill="#fefcf6" stroke="#e7dec9"/>
    <text x="648" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1d1f">Prove it</text>
    <text x="648" y="69" text-anchor="middle" font-size="14" fill="#4a4a4a">vocabulary list</text>
    <text x="648" y="92" text-anchor="middle" font-size="14" fill="#4a4a4a">and timed mocks</text>
  </g>
</svg>

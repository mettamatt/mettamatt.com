<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-labelledby="title desc">
  <title id="title">CCSE study timeline</title>
  <desc id="desc">A study timeline from one to six weeks depending on Spanish reading comfort.</desc>
  <rect width="880" height="360" rx="6" fill="#fbf7ec"/>
  <rect x="18" y="18" width="844" height="324" rx="4" fill="none" stroke="#e7dec9" stroke-width="2"/>
  <text x="54" y="88" font-family="Iowan Old Style, Georgia, serif" font-size="34" font-weight="700" fill="#1c1d1f">Pick the timeline that fits your Spanish</text>
  <g transform="translate(82 150)" font-family="Helvetica, Arial, sans-serif">
    <line x1="0" y1="52" x2="700" y2="52" stroke="#e7dec9" stroke-width="8" stroke-linecap="round"/>
    <circle cx="80" cy="52" r="22" fill="#6b8e23"/><text x="80" y="58" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1</text>
    <circle cx="300" cy="52" r="22" fill="#c9a227"/><text x="300" y="58" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1d1f">3</text>
    <circle cx="560" cy="52" r="22" fill="#ad1519"/><text x="560" y="58" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">6</text>
    <text x="80" y="110" text-anchor="middle" font-size="16" fill="#4a4a4a">1-2 weeks</text>
    <text x="300" y="110" text-anchor="middle" font-size="16" fill="#4a4a4a">3-4 weeks</text>
    <text x="560" y="110" text-anchor="middle" font-size="16" fill="#4a4a4a">4-6 weeks</text>
    <text x="80" y="138" text-anchor="middle" font-size="14" fill="#6b6b6b">confident reader</text>
    <text x="300" y="138" text-anchor="middle" font-size="14" fill="#6b6b6b">intermediate</text>
    <text x="560" y="138" text-anchor="middle" font-size="14" fill="#6b6b6b">basic reader</text>
  </g>
</svg>
